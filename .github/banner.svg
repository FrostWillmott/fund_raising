<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#238636"/>
      <stop offset="100%" style="stop-color:#2ea043"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#21262d"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="0.5"/>
  </pattern>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.6"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="#238636" opacity="0.04"/>
  <circle cx="1180" cy="540" r="250" fill="#1f6feb" opacity="0.05"/>
  <circle cx="640" cy="320" r="400" fill="#238636" opacity="0.02"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1280" height="3" fill="url(#accent)"/>

  <!-- Main card -->
  <rect x="80" y="100" width="1120" height="440" rx="16" fill="url(#card)" filter="url(#shadow)" opacity="0.9"/>
  <rect x="80" y="100" width="1120" height="440" rx="16" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Left accent bar -->
  <rect x="80" y="100" width="4" height="440" rx="2" fill="url(#accent)"/>

  <!-- Money / fundraising icon (coin stack) -->
  <g transform="translate(155, 220)" filter="url(#glow)">
    <!-- Coin 1 (bottom) -->
    <ellipse cx="60" cy="185" rx="55" ry="16" fill="#238636" opacity="0.3"/>
    <rect x="5" y="155" width="110" height="30" rx="4" fill="#1a472a"/>
    <ellipse cx="60" cy="155" rx="55" ry="16" fill="#2ea043"/>
    <text x="60" y="160" text-anchor="middle" font-size="14" fill="#ffffff" font-family="monospace" font-weight="bold">$</text>
    <!-- Coin 2 (middle) -->
    <ellipse cx="60" cy="135" rx="55" ry="16" fill="#238636" opacity="0.3"/>
    <rect x="5" y="105" width="110" height="30" rx="4" fill="#1a472a"/>
    <ellipse cx="60" cy="105" rx="55" ry="16" fill="#3fb950"/>
    <text x="60" y="110" text-anchor="middle" font-size="14" fill="#ffffff" font-family="monospace" font-weight="bold">$</text>
    <!-- Coin 3 (top) -->
    <ellipse cx="60" cy="85" rx="55" ry="16" fill="#238636" opacity="0.3"/>
    <rect x="5" y="55" width="110" height="30" rx="4" fill="#1a472a"/>
    <ellipse cx="60" cy="55" rx="55" ry="16" fill="#56d364"/>
    <text x="60" y="60" text-anchor="middle" font-size="14" fill="#0d1117" font-family="monospace" font-weight="bold">$</text>
  </g>

  <!-- Title -->
  <text x="360" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="700" fill="#f0f6fc" letter-spacing="-1">Group Fundraising</text>
  <text x="360" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="700" fill="#f0f6fc" letter-spacing="-1">Service</text>

  <!-- Tagline -->
  <text x="360" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#8b949e" letter-spacing="0.2">Production-ready REST API for group fundraising</text>

  <!-- Divider -->
  <line x1="360" y1="335" x2="1140" y2="335" stroke="#30363d" stroke-width="1"/>

  <!-- Tech stack pills -->
  <g transform="translate(360, 360)">
    <!-- Django -->
    <rect x="0" y="0" width="110" height="36" rx="18" fill="#092E20" stroke="#2ea043" stroke-width="1"/>
    <text x="55" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#3fb950">Django 5.2</text>

    <!-- DRF -->
    <rect x="122" y="0" width="110" height="36" rx="18" fill="#1a1a2e" stroke="#a21a3a" stroke-width="1"/>
    <text x="177" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#e84393">DRF</text>

    <!-- Celery -->
    <rect x="244" y="0" width="110" height="36" rx="18" fill="#1a2a1a" stroke="#37b24d" stroke-width="1"/>
    <text x="299" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#69db7c">Celery</text>

    <!-- Redis -->
    <rect x="366" y="0" width="110" height="36" rx="18" fill="#2a1a1a" stroke="#cc3333" stroke-width="1"/>
    <text x="421" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#ff6b6b">Redis</text>

    <!-- MySQL -->
    <rect x="488" y="0" width="110" height="36" rx="18" fill="#1a1e2a" stroke="#00758f" stroke-width="1"/>
    <text x="543" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#00aec4">MySQL</text>

    <!-- Docker -->
    <rect x="610" y="0" width="110" height="36" rx="18" fill="#1a1e2a" stroke="#2496ed" stroke-width="1"/>
    <text x="665" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#2496ed">Docker</text>
  </g>

  <!-- Feature highlights -->
  <g transform="translate(360, 430)">
    <circle cx="8" cy="8" r="4" fill="#238636"/>
    <text x="22" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#8b949e">JWT Auth</text>

    <circle cx="138" cy="8" r="4" fill="#238636"/>
    <text x="152" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#8b949e">Async Email</text>

    <circle cx="298" cy="8" r="4" fill="#238636"/>
    <text x="312" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#8b949e">Atomic Payments</text>

    <circle cx="488" cy="8" r="4" fill="#238636"/>
    <text x="502" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#8b949e">Image Processing</text>

    <circle cx="668" cy="8" r="4" fill="#238636"/>
    <text x="682" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#8b949e">Swagger UI</text>
  </g>

  <!-- Bottom github link -->
  <text x="640" y="590" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#30363d">github.com/FrostWillmott/fund_raising</text>
</svg>
